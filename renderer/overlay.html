<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />

  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "Segoe UI", sans-serif; user-select: none; }
    #buddy { position: absolute; left: 0; bottom: 6px; width: 170px; will-change: transform; }
    /* 3D canvas is wider/taller than the buddy box so raised arms, hops and the rain cloud fit */
    #svg-host { width: 260px; height: 420px; margin-left: -45px; }

    .bubble { position: absolute; left: 168px; bottom: 190px; width: 290px; padding: 16px 18px;
      background: #fff; color: #0f172a; border-radius: 18px; box-shadow: 0 10px 30px rgba(0,0,0,.25);

    .bubble.show { opacity: 1; transform: none; pointer-events: auto; }
    .bubble::before { content: ""; position: absolute; left: -10px; bottom: 26px; border: 10px solid transparent;
      border-right-color: #fff; border-left: 0; }
    .msg { font-size: 18px; font-weight: 700; line-height: 1.3; }
    .sub { white-space: pre-line; margin-top: 6px; font-size: 13px; color: #475569; }
    .btns { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
    .btns[hidden] { display: none; }
    button { font: inherit; font-size: 15px; font-weight: 600; border: 0; border-radius: 12px;
      padding: 10px 12px; cursor: pointer; transition: transform .1s, filter .15s; }
    button:hover { filter: brightness(1.07); transform: translateY(-1px); }
    button:active { transform: translateY(1px); }
    #drink { background: linear-gradient(135deg, #38bdf8, #2563eb); color: #fff; }
    #later { background: #e2e8f0; color: #334155; }

    .chip { position: absolute; pointer-events: none; white-space: nowrap; padding: 6px 12px; border-radius: 999px;

    .particle { position: absolute; font-size: 26px; pointer-events: none; }
    .dust { position: absolute; width: 26px; height: 16px; border-radius: 50%; pointer-events: none;
      background: radial-gradient(circle, rgba(200,180,150,.85), rgba(200,180,150,0) 70%); }
  </style>
</head>

  <div id="buddy">
    <div id="svg-host"></div>
    <div class="bubble" id="bubble">
      <div class="msg" id="msg"></div>
      <div class="sub" id="sub"></div>
      <div class="btns" id="btns">
        <button id="drink">🥤 Taking water now</button>
